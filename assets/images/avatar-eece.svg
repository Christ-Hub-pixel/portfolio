<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318" />
      <stop offset="100%" stop-color="#07080A" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond circulaire sombre -->
  <circle cx="200" cy="200" r="190" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Lueur diffuse dorée d'arrière-plan -->
  <circle cx="200" cy="200" r="160" fill="url(#goldGlow)" />

  <!-- Anneau géométrique interne -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />

  <!-- Motif technologique discret -->
  <path d="M 90 200 L 120 200 M 280 200 L 310 200 M 200 90 L 200 120 M 200 280 L 200 310" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Monogramme central stylisé EECE -->
  <g id="monogram" filter="url(#shadowGlow)">
    <!-- Forme abstraite géométrique représentant l'initiale E et l'ingénierie -->
    <rect x="135" y="130" width="130" height="140" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" />
    
    <text x="200" y="215" font-family="'Plus Jakarta Sans', 'Syne', sans-serif" font-size="54" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
      EECE
    </text>
    <text x="200" y="245" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#E5C158" text-anchor="middle" letter-spacing="6">
      SOFTWARE DEV
    </text>
  </g>

  <!-- Petite pastille statut active -->
  <circle cx="295" cy="295" r="14" fill="#07080A" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="295" cy="295" r="8" fill="#52C41A" />
</svg>
