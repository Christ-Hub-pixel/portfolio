<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFoncier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0A0A0D" />
    </linearGradient>
    <linearGradient id="goldFoncier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F5E083" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bgFoncier)" stroke="#2C2D38" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="520" height="50" rx="10" fill="#1B1C24" stroke="#D4AF37" stroke-opacity="0.3"/>
  <text x="65" y="61" fill="#F5E083" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">🏛️ FONCIER 360</text>
  <rect x="400" y="40" width="145" height="30" rx="6" fill="#101116" stroke="#D4AF37" stroke-width="1"/>
  <text x="472" y="60" fill="#D4AF37" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">ACD & ATTESTATION</text>

  <!-- Left: Cadastral Map Representation -->
  <rect x="40" y="95" width="280" height="245" rx="12" fill="#0E0F14" stroke="#252632"/>
  <path d="M 60 140 L 150 120 L 210 180 L 120 220 Z" fill="#D4AF37" fill-opacity="0.2" stroke="#D4AF37" stroke-width="2"/>
  <text x="135" y="170" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">LOT #104-B</text>
  <path d="M 160 120 L 280 110 L 290 200 L 215 180 Z" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="235" y="150" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="10">LOT #105</text>
  <path d="M 60 230 L 140 230 L 180 310 L 80 310 Z" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
  <text x="110" y="275" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10">LOT #106</text>
  <circle cx="135" cy="185" r="4" fill="#E5C158"/>

  <!-- Right: Parcel Details & Security Status -->
  <g transform="translate(335, 95)">
    <rect x="0" y="0" width="225" height="245" rx="12" fill="#12131A" stroke="#252632"/>
    <text x="20" y="30" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">DOSSIER PARCELLE</text>
    <text x="20" y="55" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Grand-Bassam, Zone Phare</text>
    <line x1="20" y1="70" x2="205" y2="70" stroke="#252632"/>
    
    <text x="20" y="95" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">SUPERFICIE : 600 m²</text>
    <text x="20" y="118" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">STATUT : ACD en cours</text>
    <text x="20" y="141" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">SÉCURISATION : 100%</text>

    <rect x="20" y="165" width="185" height="28" rx="6" fill="#1E293B"/>
    <text x="112" y="183" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">📄 Acte notarié vérifié</text>

    <rect x="20" y="202" width="185" height="30" rx="6" fill="url(#goldFoncier)"/>
    <text x="112" y="222" fill="#0A0B0E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">VOIR CERTIFICAT</text>
  </g>
</svg>
