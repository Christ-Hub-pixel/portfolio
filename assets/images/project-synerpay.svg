<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlowS" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E1B0E"/>
      <stop offset="55%" stop-color="#090B12"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>
    <linearGradient id="goldCardS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#272215"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#6E5211"/>
    </linearGradient>
    <linearGradient id="goldBorderS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGlowS)"/>
  <circle cx="240" cy="170" r="145" fill="#D4AF37" opacity="0.1"/>
  <circle cx="580" cy="320" r="150" fill="#10B981" opacity="0.09"/>

  <!-- Phone 1 : Wallet Synerpay -->
  <g transform="translate(132, 34)" filter="url(#shadowS)">
    <rect x="0" y="0" width="240" height="432" rx="30" fill="#0A0C12" stroke="url(#goldBorderS)" stroke-width="2"/>
    <rect x="10" y="10" width="220" height="412" rx="22" fill="#0E1118"/>
    <rect x="88" y="18" width="64" height="12" rx="6" fill="#05060A"/>

    <text x="24" y="54" fill="#FDE68A" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800">Synerpay</text>
    <rect x="150" y="40" width="66" height="20" rx="10" fill="#10B981" opacity="0.18"/>
    <text x="183" y="53" text-anchor="middle" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="700">AES-256 ✓</text>

    <!-- Virtual Gold Card -->
    <rect x="22" y="72" width="196" height="114" rx="16" fill="url(#goldCardS)" stroke="#FDE68A" stroke-opacity="0.6"/>
    <text x="36" y="94" fill="#09090B" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="800" letter-spacing="1.2">SYNERPAY BLACK GOLD</text>
    <text x="36" y="128" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="20" font-weight="900">1 485 000 F</text>
    <text x="36" y="148" fill="#FEF3C7" font-family="Consolas, monospace" font-size="10">••••  ••••  ••••  4829</text>
    <text x="36" y="170" fill="#09090B" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800">EZOUA E. CHRIST</text>
    <text x="204" y="170" text-anchor="end" fill="#09090B" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800">09/29</text>

    <!-- Quick Actions -->
    <rect x="22" y="200" width="93" height="36" rx="12" fill="#D4AF37"/>
    <text x="68" y="222" text-anchor="middle" fill="#09090B" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="800">↑ Envoyer</text>
    <rect x="125" y="200" width="93" height="36" rx="12" fill="#171C28" stroke="#D4AF37" stroke-opacity="0.45"/>
    <text x="171" y="222" text-anchor="middle" fill="#FDE68A" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">↓ Recevoir</text>

    <!-- Recent Transactions -->
    <text x="24" y="262" fill="#9CA3AF" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" letter-spacing="1">TRANSACTIONS RÉCENTES</text>

    <rect x="22" y="274" width="196" height="42" rx="12" fill="#151924"/>
    <circle cx="42" cy="295" r="11" fill="#10B981" opacity="0.22"/>
    <text x="42" y="299" text-anchor="middle" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">+</text>
    <text x="60" y="292" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">Dépôt Mobile Money</text>
    <text x="60" y="306" fill="#6B7280" font-family="Segoe UI, sans-serif" font-size="8">Aujourd'hui • 14:20</text>
    <text x="208" y="299" text-anchor="end" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800">+125 000 F</text>

    <rect x="22" y="324" width="196" height="42" rx="12" fill="#151924"/>
    <circle cx="42" cy="345" r="11" fill="#D4AF37" opacity="0.22"/>
    <text x="42" y="349" text-anchor="middle" fill="#FDE68A" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">→</text>
    <text x="60" y="342" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">Transfert Instantané</text>
    <text x="60" y="356" fill="#6B7280" font-family="Segoe UI, sans-serif" font-size="8">Hier • 19:05</text>
    <text x="208" y="349" text-anchor="end" fill="#FDE68A" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800">-45 000 F</text>

    <rect x="80" y="400" width="80" height="4" rx="2" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- Phone 2 : Transfert Sécurisé -->
  <g transform="translate(424, 56)" filter="url(#shadowS)">
    <rect x="0" y="0" width="244" height="406" rx="30" fill="#0A0C12" stroke="url(#goldBorderS)" stroke-width="2"/>
    <rect x="10" y="10" width="224" height="386" rx="22" fill="#0E1118"/>
    <rect x="90" y="18" width="64" height="12" rx="6" fill="#05060A"/>

    <text x="122" y="54" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">Transfert Sécurisé</text>

    <!-- Shield -->
    <circle cx="122" cy="112" r="34" fill="#10B981" opacity="0.16" stroke="#34D399" stroke-width="1.5"/>
    <path d="M122 92 L138 99 V113 C138 123 131 131 122 134 C113 131 106 123 106 113 V99 Z" fill="#10B981" opacity="0.85"/>
    <path d="M115 113 L120 118 L130 107" fill="none" stroke="#05060A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="122" y="170" text-anchor="middle" fill="#FDE68A" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900">75 000 FCFA</text>
    <text x="122" y="188" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, sans-serif" font-size="9.5">Frais réduits • Validation biométrique</text>

    <!-- Details Box -->
    <rect x="22" y="208" width="200" height="106" rx="14" fill="#151924" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="34" y="232" fill="#9CA3AF" font-family="Segoe UI, sans-serif" font-size="9">Destinataire</text>
    <text x="210" y="232" text-anchor="end" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">K. Jean-Marc</text>
    <line x1="34" y1="244" x2="210" y2="244" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="34" y="264" fill="#9CA3AF" font-family="Segoe UI, sans-serif" font-size="9">Base sécurisée</text>
    <text x="210" y="264" text-anchor="end" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">PostgreSQL ACID</text>
    <line x1="34" y1="276" x2="210" y2="276" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="34" y="298" fill="#9CA3AF" font-family="Segoe UI, sans-serif" font-size="9">Statut</text>
    <text x="210" y="298" text-anchor="end" fill="#FDE68A" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">Prêt à confirmer</text>

    <rect x="22" y="330" width="200" height="40" rx="14" fill="#10B981"/>
    <text x="122" y="354" text-anchor="middle" fill="#05060A" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">Confirmer le Paiement</text>
  </g>
</svg>
